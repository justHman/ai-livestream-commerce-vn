# _python-service-ci — reusable per-service Python checks for product services.
#
# Reusable workflow (underscore prefix, workflow_call only). Runs ruff format/
# lint, typecheck (pyright), unit tests, and — only when the calling mode
# requests them — integration, contract and coverage suites. Pytest steps
# propagate non-zero exits: a red test fails the job (no `|| true` swallow),
# and the coverage gate enforces --cov-fail-under=80 when enabled. Every
# skipped check reports a neutral success so the aggregate `CI / gate` never
# waits on a job that was deliberately not run (design §4, 3.3).
#
# Test matrix per mode lives in scripts/ci/test_matrix.json (committed 1.59);
# this workflow is the execution layer honoring it. Product services use
# `uv sync --frozen` with their own service pyproject (no root workspace).

name: _python-service-ci

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array of product services to check, e.g. ["backend","llm"] (use fromJson on the caller side)'
        type: string
        required: true
      integration:
        description: "Run integration suites (default false: feature-push mode omits them)"
        type: boolean
        default: false
      contract:
        description: "Run contract suites (default false)"
        type: boolean
        default: false
      coverage:
        description: "Enforce branch coverage gate (default false)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    # Skip entirely when no service is affected: an empty matrix would fail
    # workflow evaluation ("Matrix vector 'service' does not contain any
    # values") and mark the run failed even though neutral-skip passed.
    if: ${{ inputs.services != '[]' }}
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      # setup-uv exports VIRTUAL_ENV pointing at the repo-root .venv; every
      # step below must use the service-local venv (root lock lacks dev deps).
      VIRTUAL_ENV: ${{ github.workspace }}/services/product/${{ matrix.service }}/.venv
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Sync service environment
        run: uv sync --frozen --group dev --no-cache
        working-directory: services/product/${{ matrix.service }}
      # tts_service additionally installs its optional vieneu extra so the real
      # provider (and its provider tests) run in CI instead of ModuleNotFoundError.
      - name: Sync tts provider extras
        if: ${{ matrix.service == 'tts_service' }}
        run: uv sync --frozen --group dev --no-cache --extra vieneu
        working-directory: services/product/${{ matrix.service }}
      - name: Format check
        run: uvx ruff format --check --no-cache src tests
        working-directory: services/product/${{ matrix.service }}
      - name: Lint
        run: uvx ruff check --no-cache src tests
        working-directory: services/product/${{ matrix.service }}
      # Typecheck: known type debt (111+ errors/service, pre-existing from
      # legacy code migration). Reported but not merge-blocking; fix in follow-up.
      - name: Typecheck (non-blocking)
        continue-on-error: true
        run: uvx pyright --pythonpath .venv/bin/python src tests
        working-directory: services/product/${{ matrix.service }}
      - name: Unit tests
        run: ./.venv/bin/python -m pytest tests -q -p no:cacheprovider --tb=short --ignore=tests/integration --ignore=tests/contract
        working-directory: services/product/${{ matrix.service }}
      # backend_service's embedded-PG harness prefers a system postgres install
      # on Linux (tests/integration/pg_harness.py). ubuntu-latest ships none, so
      # install it and export its bin dir to PATH for the which/glob lookup.
      - name: Install PostgreSQL for integration tests
        if: ${{ inputs.integration && matrix.service == 'backend_service' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - name: Integration tests
        if: ${{ inputs.integration }}
        run: ./.venv/bin/python -m pytest tests/integration -q -p no:cacheprovider --tb=short
        working-directory: services/product/${{ matrix.service }}
      - name: Contract tests
        if: ${{ inputs.contract }}
        run: ./.venv/bin/python -m pytest tests/contract -q -p no:cacheprovider --tb=short
        working-directory: services/product/${{ matrix.service }}
      - name: Coverage gate
        if: ${{ inputs.coverage }}
        # --cov with no target reads [tool.coverage.run] source from the service
        # pyproject (e.g. "backend", not the service dir name "backend_service").
        # The service pyproject addopts ignore integration/contract by default;
        # override them here so the coverage gate measures unit + integration
        # (CI runs both), matching the real tested surface. Contract suites are
        # subprocess drift checks, not coverage contributors — kept ignored.
        run: ./.venv/bin/python -m pytest tests -q -p no:cacheprovider --tb=short --override-ini "addopts=" --ignore=tests/contract --cov --cov-fail-under=80
        working-directory: services/product/${{ matrix.service }}

  neutral-skip:
    # Always run (not `if: inputs.services == ''`): a skipped job makes the
    # reusable's needs.<job>.result = failure, which fails the CI gate on
    # ci-only changes (empty services matrix). Running as success keeps the
    # aggregate green while services stay empty.
    runs-on: ubuntu-latest
    steps:
      - run: echo "No product service affected; reporting neutral success."
