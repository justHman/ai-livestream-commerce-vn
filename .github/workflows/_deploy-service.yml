# _deploy-service — reusable service deployment (image swap + rollback + smoke).
#
# Reusable workflow (underscore prefix, workflow_call only — no deployment
# triggers, design §2). Deploys ONE service: reads the current task
# definition, registers a new revision with the target image, updates the ECS
# service, waits for stability, then runs an optional HTTP smoke. On any
# failure it restores ONLY this service to its previous task definition
# (design §6 — rollback is service-scoped; other services are untouched).
#
# The deploy job binds the caller's protected environment via
# `environment: ${{ inputs.env }}` so the protected-environment secret/
# approval boundary is preserved on the called side; `id-token: write` is
# granted for OIDC role assumption. This file has no deployment trigger.
#
# prev_digest / new_digest are recorded for the deployment evidence chain
# (4.4): the image ref currently deployed vs the target image. new_digest is
# resolved to an immutable digest via buildx imagetools inspect when the
# target image has a tag; digest targets are recorded verbatim.
name: _deploy-service

on:
  workflow_call:
    inputs:
      env:
        description: "Target environment name (development|staging|production) for evidence"
        type: string
        required: true
      commit_sha:
        description: "Immutable commit SHA being deployed (evidence)"
        type: string
        required: true
      initiator:
        description: "Actor who triggered the deployment (evidence)"
        type: string
        required: true
      cluster:
        description: "ECS cluster name"
        type: string
        required: true
      service:
        description: "ECS service name"
        type: string
        required: true
      container:
        description: "Container name inside the task definition to swap"
        type: string
        required: true
      image:
        description: "Target image ref (repo:tag or repo@sha256:...)"
        type: string
        required: true
      aws_region:
        description: "AWS region"
        type: string
        default: "ap-northeast-2"
      smoke_url:
        description: "HTTP smoke URL (backend only; empty skips smoke)"
        type: string
        default: ""
    secrets:
      role_arn:
        description: "AWS deploy role ARN to assume"
        required: true
      dockerhub_user:
        description: "Docker Hub username for image push"
        required: true
      dockerhub_token:
        description: "Docker Hub token for image push"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    env:
      ECS_CLUSTER: ${{ inputs.cluster }}
      ECS_SERVICE: ${{ inputs.service }}
      CONTAINER: ${{ inputs.container }}
      IMAGE: ${{ inputs.image }}
      SMOKE_URL: ${{ inputs.smoke_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role_arn }}
          aws-region: ${{ inputs.aws_region }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy service with service-scoped rollback and smoke
        id: deploy
        env:
          ENV_NAME: ${{ inputs.env }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          INITIATOR: ${{ inputs.initiator }}
        run: |
          set -euo pipefail

          # Resolve new digest for evidence (digest targets pass through).
          if [[ "$IMAGE" == *"@sha256:"* ]]; then
            new_digest="$IMAGE"
          else
            new_digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          fi

          details=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE")
          status=$(jq -r '.services[0].status // empty' <<<"$details")
          failures=$(jq '.failures | length' <<<"$details")
          if [[ "$status" != ACTIVE || "$failures" -gt 0 ]]; then
            echo "Service $ECS_SERVICE not ACTIVE (status=$status, failures=$failures)." >&2
            exit 1
          fi
          old_task=$(jq -r '.services[0].taskDefinition' <<<"$details")
          task=$(aws ecs describe-task-definition --task-definition "$old_task" --query taskDefinition)
          prev_digest=$(jq -r --arg name "$CONTAINER" '.containerDefinitions[] | select(.name == $name) | .image' <<<"$task")
          task=$(jq --arg name "$CONTAINER" --arg img "$IMAGE" '.containerDefinitions |= map(if .name == $name then .image = $img else . end)' <<<"$task")
          task=$(jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' <<<"$task")
          new_task=$(aws ecs register-task-definition --cli-input-json "$task" --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$new_task" >/dev/null

          # Service-scoped rollback: restore ONLY this service's previous task
          # definition (which encodes the previous digest) on any failure.
          rollback() {
            trap - ERR
            echo "Deployment failed; restoring $ECS_SERVICE to $old_task." >&2
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$old_task" >/dev/null || echo "Rollback failed for $ECS_SERVICE" >&2
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" || echo "Rollback stability wait failed" >&2
            exit 1
          }
          trap rollback ERR

          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

          if [[ -n "$SMOKE_URL" ]]; then
            ok=0
            for _ in {1..12}; do
              if curl -fsS "$SMOKE_URL" >/dev/null 2>&1; then ok=1; break; fi
              sleep 10
            done
            [[ "$ok" == 1 ]] || { echo "Smoke failed: $SMOKE_URL never healthy." >&2; exit 1; }
          fi

          trap - ERR

          # Evidence line (4.4): appended at runtime to the gitignored evidence
          # store; the caller records production-eligible evidence separately.
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          evidence_dir=".runtime/deploy/evidence/$ENV_NAME"
          mkdir -p "$evidence_dir"
          printf '%s\n' "{\"ts\":\"$ts\",\"env\":\"$ENV_NAME\",\"commit_sha\":\"$COMMIT_SHA\",\"service\":\"$ECS_SERVICE\",\"initiator\":\"$INITIATOR\",\"prev_digest\":\"$prev_digest\",\"new_digest\":\"$new_digest\",\"result\":\"success\"}" >> "$evidence_dir/$COMMIT_SHA.jsonl"
          {
            echo "## Deployed $ECS_SERVICE"
            echo "- env: $ENV_NAME, commit: $COMMIT_SHA"
            echo "- prev: $prev_digest"
            echo "- new: $new_digest"
            echo "- smoke: $SMOKE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "new_digest=$new_digest" >> "$GITHUB_OUTPUT"
          echo "prev_digest=$prev_digest" >> "$GITHUB_OUTPUT"
      # R1.6: the per-leg evidence line lives on this job's runner; upload it
      # as a declared artifact (unique per env/sha/container) so downstream
      # jobs (record-evidence / record-outcome) consume it via download-artifact
      # instead of assuming a shared filesystem.
      - name: Upload deployment evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ inputs.env }}-${{ inputs.commit_sha }}-${{ inputs.container }}
          path: .runtime/deploy/evidence/${{ inputs.env }}/${{ inputs.commit_sha }}.jsonl
          if-no-files-found: error
