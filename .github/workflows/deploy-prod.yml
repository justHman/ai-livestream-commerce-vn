# deploy-prod — SUPERSEDED by release-service.yml (6.4). Triggers DISABLED.
#
# This workflow previously built release images on `v*` tag push and deployed
# them from a manual `workflow_dispatch` confirmation on main. That release
# path is replaced by release-service.yml (OpenSpec 5.x): service-scoped tags
# (`<service>-vMAJOR.MINOR.PATCH`), main ancestry + staging evidence gates,
# protected `production` environment approval, exact-digest promotion, and
# service-scoped rollback.
#
# 6.4 disable record (deliberate, documented, revertible):
# - `on.push.tags: ["v*"]` removed — a plain v-prefixed tag is no longer a
#   release trigger (release-service.yml owns tag-triggered releases).
# - `on.workflow_dispatch` removed — the manual confirmation deploy path is
#   superseded by the protected production environment + approval in
#   release-service.yml; a stale mutable-tag manual deploy would bypass the
#   staging-evidence and exact-digest gates.
# - The file is retained (not deleted) so the old behavior is one
#   `git revert` away; it has zero live triggers and cannot start.
#
# Verified before disabling (6.4 precondition): release-service.yml dry-runs
# pass (5.1-5.5, simulated in scripts/ci/simulate_release_path.py), deploy-prod
# has ZERO runs in remote history, and no repo path references it as active.
#
# `on.push.branches: ["**"]`: a workflow file with no matching trigger creates
# a failed empty run when a push edits .github/workflows/ ("No event triggers
# defined in `on`"). Matching all branch pushes makes such pushes produce a
# green no-op run instead; job guards (below) keep every job from running on
# branch pushes, so release behavior is unchanged.
name: deploy-prod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  STATE_BUCKET: ai-livestream-tfstate-191918535424

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve-tag:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Validate ref and release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PUSH_REF: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "Manual PROD dispatch must run from main (got $GITHUB_REF)." >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="$PUSH_REF"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH exactly: $tag" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-tag
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - svc: backend
            dockerfile: services/product/backend_service/Dockerfile
            image: imjusthman/ai-live-backend
            platform: linux/arm64
            needs_qemu: true
          - svc: llm
            dockerfile: services/product/llm_service/Dockerfile
            image: imjusthman/ai-live-llm
            platform: linux/amd64
            needs_qemu: false
          - svc: tts
            dockerfile: services/product/tts_service/Dockerfile
            image: imjusthman/ai-live-tts
            platform: linux/amd64
            needs_qemu: false
          - svc: avatar
            dockerfile: services/product/avatar_service/Dockerfile
            image: imjusthman/ai-live-avatar
            platform: linux/amd64
            needs_qemu: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0
      - name: Verify exact tag checkout
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG not present." >&2
            exit 1
          }
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          [[ "$tag_commit" == "$head_commit" ]] || {
            echo "HEAD does not point to $RELEASE_TAG commit." >&2
            exit 1
          }
          git describe --tags --exact-match HEAD >/dev/null || {
            echo "HEAD is not an exact tagged commit." >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag commit is not reachable from origin/main." >&2
            exit 1
          }
      - if: ${{ matrix.needs_qemu }}
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ matrix.image }}:${{ needs.resolve-tag.outputs.tag }}

  deploy:
    needs: [resolve-tag, build]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == true && needs.resolve-tag.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0
      - name: Verify exact tag checkout
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Tag $RELEASE_TAG not present." >&2
            exit 1
          }
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          [[ "$tag_commit" == "$head_commit" ]] || {
            echo "HEAD does not point to $RELEASE_TAG commit." >&2
            exit 1
          }
          git describe --tags --exact-match HEAD >/dev/null || {
            echo "HEAD is not an exact tagged commit." >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release tag commit is not reachable from origin/main." >&2
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify all 4 release image manifests exist
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          for image in \
            imjusthman/ai-live-backend \
            imjusthman/ai-live-llm \
            imjusthman/ai-live-tts \
            imjusthman/ai-live-avatar; do
            docker buildx imagetools inspect "$image:$RELEASE_TAG" >/dev/null || {
              echo "Image $image:$RELEASE_TAG manifest not found." >&2
              exit 1
            }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Read production Terraform outputs
        id: tf
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$STATE_BUCKET"
          terraform -chdir=infra/environments/prod init -input=false
          output=$(terraform -chdir=infra/environments/prod output -json)
          cluster=$(jq -r '.ecs_cluster_name.value // empty' <<<"$output")
          backend_svc=$(jq -r '.ecs_service_names.value.backend // empty' <<<"$output")
          backend_tg=$(jq -r '.backend_target_group_arn.value // empty' <<<"$output")
          llm_svc=$(jq -r '.ecs_service_names.value.llm // empty' <<<"$output")
          tts_svc=$(jq -r '.ecs_service_names.value.tts // empty' <<<"$output")
          avatar_svc=$(jq -r '.ecs_service_names.value.avatar // empty' <<<"$output")
          [[ -n "$cluster" && -n "$backend_svc" && -n "$backend_tg" ]] || {
            echo "Terraform outputs incomplete (cluster/backend/target group required)." >&2
            exit 1
          }
          echo "ecs_cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "backend_service=$backend_svc" >> "$GITHUB_OUTPUT"
          echo "backend_target_group_arn=$backend_tg" >> "$GITHUB_OUTPUT"
          echo "llm_service=$llm_svc" >> "$GITHUB_OUTPUT"
          echo "tts_service=$tts_svc" >> "$GITHUB_OUTPUT"
          echo "avatar_service=$avatar_svc" >> "$GITHUB_OUTPUT"
      - name: Deploy services with rollback and smoke
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          ECS_CLUSTER: ${{ steps.tf.outputs.ecs_cluster }}
          BACKEND_SERVICE: ${{ steps.tf.outputs.backend_service }}
          LLM_SERVICE: ${{ steps.tf.outputs.llm_service }}
          TTS_SERVICE: ${{ steps.tf.outputs.tts_service }}
          AVATAR_SERVICE: ${{ steps.tf.outputs.avatar_service }}
          BACKEND_TARGET_GROUP: ${{ steps.tf.outputs.backend_target_group_arn }}
        run: |
          set -euo pipefail
          updated_services=()
          rollback_stack=()
          rollback() {
            trap - ERR
            local svc old_task entry
            for ((i=${#rollback_stack[@]}-1; i>=0; i--)); do
              entry="${rollback_stack[$i]}"
              IFS='|' read -r svc old_task <<<"$entry"
              aws ecs update-service --cluster "$ECS_CLUSTER" --service "$svc" --task-definition "$old_task" >/dev/null || echo "Rollback failed for $svc" >&2
            done
            if [[ ${#rollback_stack[@]} -gt 0 ]]; then
              local services=()
              for ((i=${#rollback_stack[@]}-1; i>=0; i--)); do
                IFS='|' read -r svc _ <<<"${rollback_stack[$i]}"
                services+=("$svc")
              done
              aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${services[@]}" || echo "Rollback stability wait failed" >&2
            fi
            exit 1
          }
          trap rollback ERR
          deploy_service() {
            local role="$1" service="$2" mandatory="$3"
            if [[ -z "$service" ]]; then
              if [[ "$mandatory" == mandatory ]]; then
                echo "$role service name is empty." >&2
                return 1
              fi
              return 0
            fi
            local details status failures old_task task new_task
            details=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service")
            status=$(jq -r '.services[0].status // empty' <<<"$details")
            failures=$(jq '.failures | length' <<<"$details")
            if [[ "$status" != ACTIVE || "$failures" -gt 0 ]]; then
              if [[ "$mandatory" == mandatory ]]; then
                echo "Mandatory $role ($service) is not ACTIVE (status=$status, failures=$failures)." >&2
                return 1
              fi
              echo "Optional $role ($service) not ACTIVE (status=$status, failures=$failures); state drift." >&2
              return 1
            fi
            old_task=$(jq -r '.services[0].taskDefinition' <<<"$details")
            task=$(aws ecs describe-task-definition --task-definition "$old_task" --query taskDefinition)
            case "$role" in
              backend)
                task=$(jq --arg img "imjusthman/ai-live-backend:$RELEASE_TAG" '.containerDefinitions |= map(if .name=="backend" then .image=$img else . end)' <<<"$task")
                ;;
              llm)
                task=$(jq --arg img "imjusthman/ai-live-llm:$RELEASE_TAG" '.containerDefinitions |= map(if .name=="llm" then .image=$img else . end)' <<<"$task")
                ;;
              tts)
                task=$(jq --arg img "imjusthman/ai-live-tts:$RELEASE_TAG" '.containerDefinitions |= map(if .name=="tts" then .image=$img else . end)' <<<"$task")
                ;;
              avatar)
                task=$(jq --arg img "imjusthman/ai-live-avatar:$RELEASE_TAG" '.containerDefinitions |= map(if .name=="avatar" then .image=$img else . end)' <<<"$task")
                ;;
              *)
                echo "Unsupported ECS role: $role" >&2
                return 1
                ;;
            esac
            task=$(jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' <<<"$task")
            new_task=$(aws ecs register-task-definition --cli-input-json "$task" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" --task-definition "$new_task" >/dev/null
            rollback_stack+=("$service|$old_task")
            updated_services+=("$service")
          }
          target_group_healthy() {
            aws elbv2 describe-target-health --target-group-arn "$BACKEND_TARGET_GROUP" | jq -e '[.TargetHealthDescriptions[].TargetHealth.State] | length > 0 and all(.[]; . == "healthy")' >/dev/null
          }
          deploy_service backend "$BACKEND_SERVICE" mandatory
          deploy_service llm "$LLM_SERVICE" optional
          deploy_service tts "$TTS_SERVICE" optional
          deploy_service avatar "$AVATAR_SERVICE" optional
          if [[ ${#updated_services[@]} -gt 0 ]]; then
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${updated_services[@]}"
          fi
          for _ in {1..12}; do
            target_group_healthy && break
            sleep 10
          done
          target_group_healthy
          trap - ERR