# deploy-staging — explicit staging deployment (OpenSpec 4.2).
#
# Manual deployment = explicit trigger (design §3): dispatched via
# `gh workflow run deploy-staging.yml --ref main -f commit_sha=<sha>
# -f services=backend_service,tts_service` (web UI / REST equivalent). The
# commit MUST be contained in main and MUST have passed the CI gate; the
# selected services are built with the shared cached build, deployed via the
# shared _deploy-service reusable (service-scoped rollback), smoke-verified
# (API Stage-1), and their image digests recorded as production-eligible
# evidence under deploy-evidence/staging/<sha>.jsonl (committed to main).
#
# ADMIN-APPLY prerequisites (not code): the protected GitHub Environment
# `staging` must exist (required reviewers optional; protection documented in
# the cluster report) and the secret AWS_ROLE_ARN_STAGING must exist
# (ai-livestream-github-deploy-staging from infra/environments/global with
# github_environment=staging). Runtime secrets are provisioned out-of-band in
# SSM under /staging/* (the deploy role has ssm:GetParameter(s), not
# PutParameter) — preflight verifies they exist and fails closed.
#
# The evidence commit to main relies on a bot push; if the main ruleset
# rejects it the workflow fails with instructions (operator lands the file
# via PR before tagging a release — release-service reads it, task 5.2).
name: deploy-staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-hex commit SHA to deploy (must be contained in main)"
        required: true
        type: string
      services:
        description: "Comma-separated services: backend_service,llm_service,tts_service,avatar_service"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  STATE_BUCKET: ai-livestream-tfstate-191918535424

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validated_sha: ${{ steps.v.outputs.validated_sha }}
      services_matrix: ${{ steps.v.outputs.services_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Validate inputs, main ancestry and CI gate
        id: v
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          python scripts/ci/validate_workflow_inputs.py \
            --sha "$COMMIT_SHA" \
            --profile deploy-staging \
            --services "$SERVICES" \
            --repo-root . \
            --github-output
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "Commit $COMMIT_SHA is not contained in origin/main." >&2
            echo "deploy-staging dispatches must target a commit reachable from main." >&2
            exit 1
          }
      - name: Verify CI gate passed for commit
        env:
          COMMIT_SHA: ${{ steps.v.outputs.validated_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${COMMIT_SHA}&event=push&per_page=10" \
            --jq '[.workflow_runs[] | select(.name == "ci" or .path == ".github/workflows/ci.yml")] | sort_by(.created_at) | reverse | .[0] | {conclusion, status} // empty')
          status=$(jq -r '.status // "missing"' <<<"$conclusion")
          result=$(jq -r '.conclusion // "missing"' <<<"$conclusion")
          if [[ "$status" != "completed" || "$result" != "success" ]]; then
            echo "CI gate for $COMMIT_SHA is not a completed success (status=$status conclusion=$result)." >&2
            echo "Deployment blocked by design: the commit must have passed the CI gate." >&2
            exit 1
          fi
          echo "CI gate passed for $COMMIT_SHA."

  preflight:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ecs_cluster: ${{ steps.tf.outputs.ecs_cluster }}
      backend_service: ${{ steps.tf.outputs.backend_service }}
      llm_service: ${{ steps.tf.outputs.llm_service }}
      tts_service: ${{ steps.tf.outputs.tts_service }}
      avatar_service: ${{ steps.tf.outputs.avatar_service }}
      has_llm: ${{ steps.tf.outputs.has_llm }}
      has_tts: ${{ steps.tf.outputs.has_tts }}
      has_avatar: ${{ steps.tf.outputs.has_avatar }}
      public_subnet_ids: ${{ steps.tf.outputs.public_subnet_ids }}
      backend_sg_id: ${{ steps.tf.outputs.backend_sg_id }}
      migrate_task_arn: ${{ steps.tf.outputs.migrate_task_arn }}
      smoke_url: ${{ steps.tf.outputs.smoke_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify Terraform bootstrap
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$STATE_BUCKET" || {
            echo "Missing or inaccessible Terraform state bucket $STATE_BUCKET." >&2
            exit 1
          }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Verify runtime secrets exist (provisioned out-of-band)
        run: |
          set -euo pipefail
          for name in /staging/backend/api_token /staging/admin/api_token; do
            aws ssm get-parameter --name "$name" --with-decryption >/dev/null 2>&1 || {
              echo "SSM parameter $name missing. Provision it out-of-band before deploying:" >&2
              echo "  aws ssm put-parameter --name $name --type SecureString --overwrite" >&2
              exit 1
            }
          done
          echo "Runtime secrets present."
      - name: Read deployed Terraform contract
        id: tf
        run: |
          set -euo pipefail
          terraform -chdir=infra/environments/staging init -input=false
          output=$(terraform -chdir=infra/environments/staging output -json)
          cluster=$(jq -r '.ecs_cluster_name.value // empty' <<<"$output")
          backend_svc=$(jq -r '.ecs_service_names.value.backend // empty' <<<"$output")
          migrate_task=$(jq -r '.migrate_task_arn.value // empty' <<<"$output")
          subnets_json=$(jq -c '.public_subnet_ids.value // []' <<<"$output")
          backend_sg=$(jq -r '.backend_sg_id.value // empty' <<<"$output")
          llm_svc=$(jq -r '.ecs_service_names.value.llm // empty' <<<"$output")
          tts_svc=$(jq -r '.ecs_service_names.value.tts // empty' <<<"$output")
          avatar_svc=$(jq -r '.ecs_service_names.value.avatar // empty' <<<"$output")
          scheme=$(jq -r '.alb_url_scheme.value // "https"' <<<"$output")
          dns=$(jq -r '.alb_dns_name.value // empty' <<<"$output")
          llm_desired=$(jq -e '.desired_optional_services.value.llm // 0 | if type == "number" then . else error("llm not number") end' <<<"$output")
          tts_desired=$(jq -e '.desired_optional_services.value.tts // 0 | if type == "number" then . else error("tts not number") end' <<<"$output")
          avatar_desired=$(jq -e '.desired_optional_services.value.avatar // 0 | if type == "number" then . else error("avatar not number") end' <<<"$output")
          [[ -n "$cluster" && -n "$backend_svc" ]] || {
            echo "Terraform outputs incomplete (cluster/backend service required)." >&2
            exit 1
          }
          [[ -n "$dns" ]] || { echo "alb_dns_name missing; cannot smoke." >&2; exit 1; }
          echo "ecs_cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "backend_service=$backend_svc" >> "$GITHUB_OUTPUT"
          echo "migrate_task_arn=$migrate_task" >> "$GITHUB_OUTPUT"
          echo "public_subnet_ids=$subnets_json" >> "$GITHUB_OUTPUT"
          echo "backend_sg_id=$backend_sg" >> "$GITHUB_OUTPUT"
          echo "llm_service=$llm_svc" >> "$GITHUB_OUTPUT"
          echo "tts_service=$tts_svc" >> "$GITHUB_OUTPUT"
          echo "avatar_service=$avatar_svc" >> "$GITHUB_OUTPUT"
          check_optional() {
            local desired="$1" service="$2" role="$3"
            if [[ "$desired" -gt 0 ]]; then
              [[ -n "$service" ]] || {
                echo "$role: effective desired count is positive but service name is empty." >&2
                exit 1
              }
              echo "has_$role=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_$role=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_optional "$llm_desired" "$llm_svc" llm
          check_optional "$tts_desired" "$tts_svc" tts
          check_optional "$avatar_desired" "$avatar_svc" avatar
          echo "smoke_url=$scheme://$dns/api/v1/health/live" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate, preflight]
    if: ${{ always() && needs.validate.result == 'success' && needs.preflight.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.validate.outputs.services_matrix) }}
        include:
          - service: backend_service
            role: backend
            dockerfile: services/product/backend_service/Dockerfile
            image: imjusthman/ai-live-backend
            platforms: linux/arm64
          - service: llm_service
            role: llm
            dockerfile: services/product/llm_service/Dockerfile
            image: imjusthman/ai-live-llm
            platforms: linux/amd64
          - service: tts_service
            role: tts
            dockerfile: services/product/tts_service/Dockerfile
            image: imjusthman/ai-live-tts
            platforms: linux/amd64
          - service: avatar_service
            role: avatar
            dockerfile: services/product/avatar_service/Dockerfile
            image: imjusthman/ai-live-avatar
            platforms: linux/amd64
    uses: ./.github/workflows/_container-build.yml
    with:
      image: ${{ matrix.image }}
      tag: staging-${{ needs.validate.outputs.validated_sha }}
      scope: ${{ matrix.role }}
      dockerfile: ${{ matrix.dockerfile }}
      platforms: ${{ matrix.platforms }}
      push: true
      export_cache: false
    secrets: inherit

  migrate:
    needs: [validate, preflight, build]
    if: ${{ always() && needs.validate.result == 'success' && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      ECS_CLUSTER: ${{ needs.preflight.outputs.ecs_cluster }}
      MIGRATE_TASK_ARN: ${{ needs.preflight.outputs.migrate_task_arn }}
      BACKEND_SUBNETS: ${{ needs.preflight.outputs.public_subnet_ids }}
      BACKEND_SG: ${{ needs.preflight.outputs.backend_sg_id }}
      VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run pre-deploy migration
        run: |
          set -euo pipefail
          if [[ -z "$MIGRATE_TASK_ARN" ]]; then echo "No migration task configured; skipping."; exit 0; fi
          # B2: bind migration to the EXACT candidate backend image digest
          # (built with tag staging-<sha> this run) by registering a candidate-image
          # task-definition revision — ECS RunTask container overrides do NOT
          # support `image`; image identity belongs to the task definition.
          docker login -u "${{ secrets.DOCKERHUB_USER }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" >/dev/null 2>&1
          digest=$(docker buildx imagetools inspect "imjusthman/ai-live-backend:staging-${VALIDATED_SHA}" --format '{{.Manifest.Digest}}')
          [[ -n "$digest" && "$digest" == sha256:* ]] || { echo "Failed to resolve candidate backend digest for migration." >&2; exit 1; }
          candidate="imjusthman/ai-live-backend@$digest"
          echo "Migration will run candidate backend digest $candidate"
          task=$(aws ecs describe-task-definition --task-definition "$MIGRATE_TASK_ARN" --query taskDefinition)
          task=$(jq --arg name "backend" --arg img "$candidate" '.containerDefinitions |= map(if .name == $name then .image = $img else . end)' <<<"$task")
          task=$(jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' <<<"$task")
          new_task=$(aws ecs register-task-definition --cli-input-json "$task" --query taskDefinition.taskDefinitionArn --output text)
          run_id=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$new_task" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(echo "$BACKEND_SUBNETS" | jq -r 'join(",")')],securityGroups=[$(echo "$BACKEND_SG" | jq -r 'join(",")')],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          [[ -n "$run_id" && "$run_id" != "None" ]] || { echo "Migration task failed to start." >&2; exit 1; }
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$run_id"
          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$run_id" --query 'tasks[0].containers[0].exitCode' --output text)
          [[ "$exit_code" == "0" ]] || { echo "Migration failed (exit $exit_code). Deployment aborted." >&2; exit 1; }
          echo "Migration completed."

  deploy:
    needs: [validate, preflight, build, migrate]
    if: ${{ always() && needs.validate.result == 'success' && needs.preflight.result == 'success' && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.validate.outputs.services_matrix) }}
        include:
          - service: backend_service
            role: backend
            image: imjusthman/ai-live-backend
            container: backend
          - service: llm_service
            role: llm
            image: imjusthman/ai-live-llm
            container: llm
          - service: tts_service
            role: tts
            image: imjusthman/ai-live-tts
            container: tts
          - service: avatar_service
            role: avatar
            image: imjusthman/ai-live-avatar
            container: avatar
    uses: ./.github/workflows/_deploy-service.yml
    with:
      env: staging
      commit_sha: ${{ needs.validate.outputs.validated_sha }}
      initiator: ${{ github.actor }}
      cluster: ${{ needs.preflight.outputs.ecs_cluster }}
      service: ${{ needs.preflight.outputs[format('{0}_service', matrix.role)] }}
      container: ${{ matrix.container }}
      image: ${{ format('{0}:staging-{1}', matrix.image, needs.validate.outputs.validated_sha) }}
      smoke_url: ${{ matrix.role == 'backend' && needs.preflight.outputs.smoke_url || '' }}
    secrets:
      role_arn: ${{ secrets.AWS_ROLE_ARN_STAGING }}
      dockerhub_user: ${{ secrets.DOCKERHUB_USER }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  smoke:
    needs: [validate, preflight, deploy]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.validated_sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run Stage-1 API smoke
        env:
          SMOKE_URL: ${{ needs.preflight.outputs.smoke_url }}
        run: |
          set -euo pipefail
          backend_token=$(aws ssm get-parameter --name /staging/backend/api_token --with-decryption --query Parameter.Value --output text)
          admin_token=$(aws ssm get-parameter --name /staging/admin/api_token --with-decryption --query Parameter.Value --output text)
          pwsh -NoProfile -File infra/scripts/staging_smoke.ps1 \
            -Stage 1 \
            -Base "${SMOKE_URL%/api/v1/health/live}" \
            -Token "$backend_token" \
            -AdminToken "$admin_token"
          echo "Stage-1 API smoke passed."
          echo "Stage 2/3 (real engines / avatar E2E) are operator-run billable gates;"
          echo "run infra/scripts/staging_smoke.ps1 -Stage 2 (then 3) against this stack."
      - name: Summarize smoke
        run: |
          echo "## Staging smoke (Stage 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke passed for ${{ needs.validate.outputs.validated_sha }} at ${{ needs.preflight.outputs.smoke_url }}" >> "$GITHUB_STEP_SUMMARY"

  record-evidence:
    needs: [validate, smoke, deploy]
    # R1.6: never commit an empty/broken evidence file when a leg failed.
    if: ${{ always() && needs.validate.result == 'success' && needs.smoke.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    env:
      VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # R1.6: each deploy leg uploaded its evidence line as
      # deploy-evidence-staging-<sha>-<container>; download them via declared
      # artifact transport (no shared runner filesystem).
      - name: Download per-service deployment evidence
        uses: actions/download-artifact@v4
        with:
          path: .runtime/deploy/evidence/raw
          pattern: deploy-evidence-staging-${{ env.VALIDATED_SHA }}-*
      - name: Collect production-eligible evidence digests
        run: |
          set -euo pipefail
          mkdir -p "deploy-evidence/staging"
          file="deploy-evidence/staging/$VALIDATED_SHA.jsonl"
          : > "$file"
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          prefix=".runtime/deploy/evidence/raw/deploy-evidence-staging-${VALIDATED_SHA}-"
          for adir in "${prefix}"*/; do
            [[ -d "$adir" ]] || continue
            container=${adir#"$prefix"}
            container=${container%/}
            # Each artifact holds the single evidence file at its root
            # (upload-artifact@v4 stores a non-glob file at artifact root).
            ef="$adir/$VALIDATED_SHA.jsonl"
            [[ -f "$ef" ]] || continue
            prev=$(jq -r '.prev_digest' "$ef")
            new=$(jq -r '.new_digest' "$ef")
            printf '%s\n' "{\"ts\":\"$ts\",\"env\":\"staging\",\"commit_sha\":\"$VALIDATED_SHA\",\"service\":\"$container\",\"initiator\":\"${{ github.actor }}\",\"prev_digest\":\"$prev\",\"new_digest\":\"$new\",\"result\":\"success\"}" >> "$file"
          done
          echo "Evidence written to $file"
          cat "$file"
      - name: Commit evidence to main
        run: |
          set -euo pipefail
          file="deploy-evidence/staging/$VALIDATED_SHA.jsonl"
          git config user.name "ai-live-deploy-bot"
          git config user.email "deploy@users.noreply.github.com"
          git add "$file"
          git commit -m "ci(staging): record deployment evidence for $VALIDATED_SHA"
          git push origin HEAD:main || {
            echo "Evidence commit rejected (main ruleset likely denies bot pushes)." >&2
            echo "Land deploy-evidence/staging/$VALIDATED_SHA.jsonl on main via PR before" >&2
            echo "tagging a release — release-service validates it (task 5.2)." >&2
            exit 1
          }
