# deploy-dev — auto deploy to DEV on push to develop
# Requires GitHub secrets: AWS_ROLE_ARN_DEV, DOCKERHUB_USER, DOCKERHUB_TOKEN
# OIDC provider must exist in AWS account: https://token.actions.githubusercontent.com
# IAM trust: repo:justHman/ai-livestream-commerce-vn:ref:refs/heads/develop
#
# Images are built in PARALLEL jobs (matrix) — each on its own runner so the
# vLLM base images (~5-8GB each) do not exhaust a single runner's 14GB disk.
name: deploy-dev

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    strategy:
      fail-fast: false
      matrix:
        include:
          - svc: backend
            dockerfile: services/backend/Dockerfile
          - svc: llm
            dockerfile: services/llm/Dockerfile
          - svc: tts
            dockerfile: services/tts/Dockerfile
          - svc: livekit
            dockerfile: services/livekit/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.svc }} image
        run: |
          TAG=dev-${GITHUB_SHA}
          docker build -f ${{ matrix.dockerfile }} \
            -t imjusthman/ai-live-${{ matrix.svc }}:$TAG \
            -t imjusthman/ai-live-${{ matrix.svc }}:dev .
          docker push imjusthman/ai-live-${{ matrix.svc }}:$TAG
          docker push imjusthman/ai-live-${{ matrix.svc }}:dev

  deploy:
    runs-on: ubuntu-latest
    environment: development
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-northeast-2

      - name: ECS rolling update DEV
        # Skips services not yet created (infra not applied) via || true.
        run: |
          for svc in backend llm-tts avatar livekit lmcache; do
            aws ecs update-service --cluster ai-livestream-dev-cluster --service ai-livestream-dev-$svc --force-new-deployment || true
          done

      - name: Smoke test
        run: curl -fsS https://api.livento.me/api/v1/health/ready