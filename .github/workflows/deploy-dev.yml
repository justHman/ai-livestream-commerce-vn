# deploy-dev — auto deploy to DEV on push to develop.
# Global Terraform bootstrap must exist before this runs.
name: deploy-dev

on:
  push:
    branches: [develop]
    paths:
      - "services/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  STATE_BUCKET: ai-livestream-tfstate-191918535424

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: development
    outputs:
      ecs_cluster: ${{ steps.tf.outputs.ecs_cluster }}
      backend_service: ${{ steps.tf.outputs.backend_service }}
      backend_target_group_arn: ${{ steps.tf.outputs.backend_target_group_arn }}
      migrate_task_arn: ${{ steps.tf.outputs.migrate_task_arn }}
      public_subnet_ids: ${{ steps.tf.outputs.public_subnet_ids }}
      backend_sg_id: ${{ steps.tf.outputs.backend_sg_id }}
      llm_service: ${{ steps.tf.outputs.llm_service }}
      tts_service: ${{ steps.tf.outputs.tts_service }}
      avatar_service: ${{ steps.tf.outputs.avatar_service }}
      has_llm: ${{ steps.tf.outputs.has_llm }}
      has_tts: ${{ steps.tf.outputs.has_tts }}
      has_avatar: ${{ steps.tf.outputs.has_avatar }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify Terraform bootstrap
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$STATE_BUCKET" || {
            echo "Missing or inaccessible Terraform state bucket $STATE_BUCKET." >&2
            exit 1
          }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Provision SSM SecureString secrets from protected environment
        env:
          BACKEND_API_TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          # Out-of-band provisioning: protected GitHub Environment secrets -> SSM
          # SecureString. Terraform never receives plaintext; values are masked
          # by GitHub and never echoed.
          aws ssm put-parameter --name "/dev/backend/api_token" --type SecureString --value "$BACKEND_API_TOKEN" --overwrite >/dev/null
          aws ssm put-parameter --name "/dev/admin/api_token" --type SecureString --value "$ADMIN_API_TOKEN" --overwrite >/dev/null
      - name: Read deployed Terraform contract
        id: tf
        run: |
          set -euo pipefail
          terraform -chdir=infra/environments/dev init -input=false
          output=$(terraform -chdir=infra/environments/dev output -json)
          cluster=$(jq -r '.ecs_cluster_name.value // empty' <<<"$output")
          backend_svc=$(jq -r '.ecs_service_names.value.backend // empty' <<<"$output")
          backend_tg=$(jq -r '.backend_target_group_arn.value // empty' <<<"$output")
          migrate_task=$(jq -r '.migrate_task_arn.value // empty' <<<"$output")
          subnets_json=$(jq -c '.public_subnet_ids.value // []' <<<"$output")
          backend_sg=$(jq -r '.backend_sg_id.value // empty' <<<"$output")
          llm_svc=$(jq -r '.ecs_service_names.value.llm // empty' <<<"$output")
          tts_svc=$(jq -r '.ecs_service_names.value.tts // empty' <<<"$output")
          avatar_svc=$(jq -r '.ecs_service_names.value.avatar // empty' <<<"$output")
          llm_desired=$(jq -e '.desired_optional_services.value.llm // 0 | if type == "number" then . else error("llm not number") end' <<<"$output")
          tts_desired=$(jq -e '.desired_optional_services.value.tts // 0 | if type == "number" then . else error("tts not number") end' <<<"$output")
          avatar_desired=$(jq -e '.desired_optional_services.value.avatar // 0 | if type == "number" then . else error("avatar not number") end' <<<"$output")
          [[ -n "$cluster" && -n "$backend_svc" && -n "$backend_tg" ]] || {
            echo "Terraform outputs incomplete (cluster/backend/target group required)." >&2
            exit 1
          }
          echo "ecs_cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "backend_service=$backend_svc" >> "$GITHUB_OUTPUT"
          echo "backend_target_group_arn=$backend_tg" >> "$GITHUB_OUTPUT"
          echo "migrate_task_arn=$migrate_task" >> "$GITHUB_OUTPUT"
          echo "public_subnet_ids=$subnets_json" >> "$GITHUB_OUTPUT"
          echo "backend_sg_id=$backend_sg" >> "$GITHUB_OUTPUT"
          echo "llm_service=$llm_svc" >> "$GITHUB_OUTPUT"
          echo "tts_service=$tts_svc" >> "$GITHUB_OUTPUT"
          echo "avatar_service=$avatar_svc" >> "$GITHUB_OUTPUT"
          check_optional() {
            local desired="$1" service="$2" role="$3"
            if [[ "$desired" -gt 0 ]]; then
              [[ -n "$service" ]] || {
                echo "$role: effective desired count is positive but service name is empty." >&2
                exit 1
              }
              echo "has_$role=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_$role=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_optional "$llm_desired" "$llm_svc" llm
          check_optional "$tts_desired" "$tts_svc" tts
          check_optional "$avatar_desired" "$avatar_svc" avatar

  build-backend:
    needs: preflight
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/backend_service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-backend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-llm:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_llm == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/llm_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-llm:dev-${{ github.sha }}

  build-tts:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_tts == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/tts_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-tts:dev-${{ github.sha }}

  build-avatar:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_avatar == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/avatar_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-avatar:dev-${{ github.sha }}

  deploy:
    needs: [preflight, build-backend, build-llm, build-tts, build-avatar]
    # Skip auto-deploy when repo variable SKIP_AUTO_DEPLOY=true (build-only run:
    # push SHA images to Docker Hub, let operator deploy manually). This
    # supports the three-stage money-safe boot: build images offline, then
    # manual Phase 1 scale-up after verifying the stack at zero cost.
    if: ${{ always() && vars.SKIP_AUTO_DEPLOY != 'true' && needs.preflight.result == 'success' && needs.build-backend.result == 'success' && (needs.build-llm.result == 'success' || needs.build-llm.result == 'skipped') && (needs.build-tts.result == 'success' || needs.build-tts.result == 'skipped') && (needs.build-avatar.result == 'success' || needs.build-avatar.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: development
    env:
      IMAGE_TAG: dev-${{ github.sha }}
      ECS_CLUSTER: ${{ needs.preflight.outputs.ecs_cluster }}
      BACKEND_SERVICE: ${{ needs.preflight.outputs.backend_service }}
      BACKEND_TARGET_GROUP: ${{ needs.preflight.outputs.backend_target_group_arn }}
      LLM_SERVICE: ${{ needs.preflight.outputs.llm_service }}
      TTS_SERVICE: ${{ needs.preflight.outputs.tts_service }}
      AVATAR_SERVICE: ${{ needs.preflight.outputs.avatar_service }}
      HAS_LLM: ${{ needs.preflight.outputs.has_llm }}
      HAS_TTS: ${{ needs.preflight.outputs.has_tts }}
      HAS_AVATAR: ${{ needs.preflight.outputs.has_avatar }}
      MIGRATE_TASK_ARN: ${{ needs.preflight.outputs.migrate_task_arn }}
      BACKEND_SUBNETS: ${{ needs.preflight.outputs.public_subnet_ids }}
      BACKEND_SG: ${{ needs.preflight.outputs.backend_sg_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy services with rollback and target health gate
        run: |
          set -euo pipefail
          updated_services=()
          rollback_stack=()
          rollback() {
            trap - ERR
            local i service old_task entry
            for ((i=${#rollback_stack[@]}-1; i>=0; i--)); do
              entry="${rollback_stack[$i]}"
              IFS='|' read -r service old_task <<<"$entry"
              aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" --task-definition "$old_task" >/dev/null || echo "Rollback failed for $service" >&2
            done
            if [[ ${#rollback_stack[@]} -gt 0 ]]; then
              local services=()
              for ((i=${#rollback_stack[@]}-1; i>=0; i--)); do
                IFS='|' read -r service _ <<<"${rollback_stack[$i]}"
                services+=("$service")
              done
              aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${services[@]}" || echo "Rollback stability wait failed" >&2
            fi
            exit 1
          }
          trap rollback ERR
          deploy_service() {
            local role="$1" service="$2" mandatory="$3" details status failures old_task task new_task
            if [[ -z "$service" ]]; then
              [[ "$mandatory" != mandatory ]] && return 0
              echo "$role service name is empty." >&2
              return 1
            fi
            details=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service")
            status=$(jq -r '.services[0].status // empty' <<<"$details")
            failures=$(jq '.failures | length' <<<"$details")
            if [[ "$status" != ACTIVE || "$failures" -gt 0 ]]; then
              echo "$role ($service) not ACTIVE (status=$status, failures=$failures)." >&2
              return 1
            fi
            old_task=$(jq -r '.services[0].taskDefinition' <<<"$details")
            task=$(aws ecs describe-task-definition --task-definition "$old_task" --query taskDefinition)
            case "$role" in
              backend)
                task=$(jq --arg image "imjusthman/ai-live-backend:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "backend" then .image = $image else . end)' <<<"$task")
                ;;
              llm)
                task=$(jq --arg image "imjusthman/ai-live-llm:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "llm" then .image = $image else . end)' <<<"$task")
                ;;
              tts)
                task=$(jq --arg image "imjusthman/ai-live-tts:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "tts" then .image = $image else . end)' <<<"$task")
                ;;
              avatar)
                task=$(jq --arg image "imjusthman/ai-live-avatar:$IMAGE_TAG" '.containerDefinitions |= map(if .name == "avatar" then .image = $image else . end)' <<<"$task")
                ;;
              *)
                echo "Unsupported ECS role: $role" >&2
                return 1
                ;;
            esac
            task=$(jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' <<<"$task")
            new_task=$(aws ecs register-task-definition --cli-input-json "$task" --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" --task-definition "$new_task" >/dev/null
            rollback_stack+=("$service|$old_task")
            updated_services+=("$service")
          }
          target_group_healthy() {
            aws elbv2 describe-target-health --target-group-arn "$BACKEND_TARGET_GROUP" | jq -e '[.TargetHealthDescriptions[].TargetHealth.State] | length > 0 and all(.[]; . == "healthy")' >/dev/null
          }
          # Pre-deploy migration: run once before backend rollout, abort on failure.
          # Additive/idempotent raw-SQL migrations only; never from task startup.
          if [[ -n "${MIGRATE_TASK_ARN:-}" ]]; then
            run_id=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$MIGRATE_TASK_ARN" --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$(echo "$BACKEND_SUBNETS" | jq -r 'join(",")')],securityGroups=[$(echo "$BACKEND_SG" | jq -r 'join(",")')],assignPublicIp=ENABLED}" \
              --query 'tasks[0].taskArn' --output text)
            [[ -n "$run_id" && "$run_id" != "None" ]] || { echo "Migration task failed to start." >&2; exit 1; }
            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$run_id"
            exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$run_id" --query 'tasks[0].containers[0].exitCode' --output text)
            [[ "$exit_code" == "0" ]] || { echo "Migration failed (exit $exit_code). Deployment aborted." >&2; exit 1; }
            echo "Migration completed."
          fi
          deploy_service backend "$BACKEND_SERVICE" mandatory
          [[ "$HAS_LLM" == true ]] && deploy_service llm "$LLM_SERVICE" optional
          [[ "$HAS_TTS" == true ]] && deploy_service tts "$TTS_SERVICE" optional
          [[ "$HAS_AVATAR" == true ]] && deploy_service avatar "$AVATAR_SERVICE" optional
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${updated_services[@]}"
          for _ in {1..12}; do
            target_group_healthy && break
            sleep 10
          done
          target_group_healthy
          trap - ERR
