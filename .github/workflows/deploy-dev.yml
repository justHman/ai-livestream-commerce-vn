# deploy-dev — auto deploy to DEV on push to develop
# Requires GitHub secrets: AWS_ROLE_ARN_DEV, DOCKERHUB_USER, DOCKERHUB_TOKEN
# OIDC provider must exist in AWS account: https://token.actions.githubusercontent.com
# IAM trust (GitHub org/user, NOT Docker Hub): repo:justHman/ai-livestream-commerce-vn:ref:refs/heads/develop
name: deploy-dev

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-northeast-2

      - name: Login to Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          TAG=dev-${{ github.sha }}
          docker build -f services/backend/Dockerfile \
            -t imjusthman/ai-live-backend:$TAG \
            -t imjusthman/ai-live-backend:dev .
          docker push imjusthman/ai-live-backend:$TAG
          docker push imjusthman/ai-live-backend:dev

      - name: ECS rolling update DEV
        # Stub: set if: true when AWS account and ECS cluster are ready
        if: false
        run: |
          for svc in backend llm tts avatar livekit lmcache; do
            aws ecs update-service --cluster ai-live-dev --service $svc --force-new-deployment
          done

      - name: Smoke test
        # Stub: set if: true when DEV endpoint is live
        if: false
        run: curl -fsS https://dev-api.example.com/api/v1/health/ready
