# build-images — build + push SHA-tagged images to Docker Hub, NO deploy.
# Supports three-stage money-safe boot: build images offline, then Phase 1
# scale-up is a separate manual step (or deploy-dev with SKIP_AUTO_DEPLOY=false).
# Use when Terraform desired counts are still 0 but you want images ready.
#
# Trigger: workflow_dispatch (manual) — pick which services to build.
name: build-images

on:
  workflow_dispatch:
    inputs:
      build-backend:
        description: "Build backend (arm64)"
        type: boolean
        default: true
      build-llm:
        description: "Build llm (amd64)"
        type: boolean
        default: true
      build-tts:
        description: "Build tts (amd64)"
        type: boolean
        default: true
      build-avatar:
        description: "Build avatar (amd64)"
        type: boolean
        default: false
      build-livekit:
        description: "Build local livekit wrapper image (arm64, local-only)"
        type: boolean
        default: false
      build-lmcache:
        description: "Build local lmcache wrapper image (arm64, local-only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-backend:
    if: ${{ inputs.build-backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/backend_service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-backend:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-llm:
    if: ${{ inputs.build-llm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/llm_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-llm:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-tts:
    if: ${{ inputs.build-tts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/tts_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-tts:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-avatar:
    if: ${{ inputs.build-avatar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/avatar_service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-avatar:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-livekit:
    if: ${{ inputs.build-livekit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/platform/livekit/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-livekit:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-lmcache:
    if: ${{ inputs.build-lmcache }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/platform/lmcache/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-lmcache:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
