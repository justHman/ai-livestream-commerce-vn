# build-images — build + push SHA-tagged images to Docker Hub, NO deploy.
# Supports three-stage money-safe boot: build images offline, then Phase 1
# scale-up is a separate manual step (or deploy-dev with SKIP_AUTO_DEPLOY=false).
# Use when Terraform desired counts are still 0 but you want images ready.
#
# Trigger: workflow_dispatch (manual) — pick which services to build.
name: build-images

on:
  workflow_dispatch:
    inputs:
      build-backend:
        description: "Build backend (arm64)"
        type: boolean
        default: true
      build-llm-tts:
        description: "Build llm + tts (amd64)"
        type: boolean
        default: true
      build-avatar:
        description: "Build avatar (amd64)"
        type: boolean
        default: false
      build-livekit:
        description: "Build livekit (arm64)"
        type: boolean
        default: false
      build-lmcache:
        description: "Build lmcache (arm64)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-backend:
    if: ${{ inputs.build-backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-backend:dev-${{ github.sha }}

  build-llm-tts:
    if: ${{ inputs.build-llm-tts }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: llm
            image: imjusthman/ai-live-llm
          - service: tts
            image: imjusthman/ai-live-tts
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:dev-${{ github.sha }}

  build-avatar:
    if: ${{ inputs.build-avatar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/avatar/Dockerfile
          platforms: linux/amd64
          push: true
          tags: imjusthman/ai-live-avatar:dev-${{ github.sha }}

  build-livekit:
    if: ${{ inputs.build-livekit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/livekit/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-livekit:dev-${{ github.sha }}

  build-lmcache:
    if: ${{ inputs.build-lmcache }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/lmcache/Dockerfile
          platforms: linux/arm64
          push: true
          tags: imjusthman/ai-live-lmcache:dev-${{ github.sha }}
