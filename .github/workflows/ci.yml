name: ci

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Pytest
        env:
          RENDER_BACKEND: mock
          LLM_ENGINE: none
          TTS_ENGINE: tone
          DIRECTOR_ENABLED: '0'
          APP_ENV: dev
        run: python -m pytest core/tests/ -q
  docker-build-backend:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: false
          tags: imjusthman/ai-live-backend:ci
          load: true
