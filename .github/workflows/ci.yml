name: ci

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff check (production and canonical service sources)
        run: >
          uvx ruff check
          core/api core/db core/debug core/director core/llm core/render
          core/schemas core/stream core/tts
          core/config.py core/engine_manager.py core/livekit_publish.py
          core/livekit_tokens.py core/pipecat_bridge.py core/store.py
          providers
          services/product/backend_service/src
          services/product/llm_service/src
          services/product/tts_service/src
          services/product/avatar_service/src
          services/product/*_service/scripts
          scripts/bench_api.py scripts/upload_weights_s3.py

  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Sync
        run: uv sync --frozen --extra test
      - name: Pytest
        env:
          RENDER_BACKEND: mock
          LLM_ENGINE: none
          TTS_ENGINE: tone
          DIRECTOR_ENABLED: '0'
          APP_ENV: dev
        run: uv run python -m pytest core/tests/ -q

  terraform-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
      - name: Format check
        run: terraform fmt -check -recursive infra

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [global, dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
      - name: Init (no backend)
        run: terraform -chdir=infra/environments/${{ matrix.workspace }} init -backend=false
      - name: Validate
        run: terraform -chdir=infra/environments/${{ matrix.workspace }} validate
      - name: Module boundary check
        run: python scripts/ci/check_infra_module_boundaries.py

  terraform-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.8'
      - name: Native tests (plan-only, no credentials)
        run: |
          terraform -chdir=infra/tests init -backend=false
          terraform -chdir=infra/tests test

  docker-build-backend:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/product/backend_service/Dockerfile
          push: false
          tags: imjusthman/ai-live-backend:ci
          load: true
