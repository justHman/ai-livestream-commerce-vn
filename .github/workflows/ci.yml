# ci — branch-governed CI entry point (OpenSpec 3.1-3.14).
#
# Always-started entry workflow for feature/*, develop and main pushes and for
# pull requests into develop and main. Derives fast / integration / release
# mode from the trusted event context (github.ref + github.base_ref) — the
# event, not the diff, decides which checks run.
#
# Modes (design §4):
#   feature push            -> secret scan, affected-area detection, format,
#                              lint, typecheck, unit tests for changed product
#                              services. No integration/contract/coverage/
#                              container/deploy.
#   PR into develop         -> affected unit+integration+contract+coverage,
#                              cached container build push:false (exports its
#                              per-service cache for downstream merge reuse),
#                              conditional workbench/platform/Terraform checks.
#                              Docs-only PRs (services_json == '[]') skip
#                              container-build entirely.
#   merge into develop      -> full affected-area integration CI + cached
#                              affected-image validation push:false against the
#                              exact merge commit.
#   PR from develop to main -> release CI: affected service tests, container
#                              validation, workbench/platform checks when
#                              affected, Terraform plan when infra changes.
#   merge into main         -> release verification against the exact merge
#                              commit; no image push, no deployment.
#
# Every mode ends in ONE stable required-check result: `CI / gate`. Skipped
# unaffected-area jobs report a successful neutral result so branch protection
# never waits on a job that was not meant to run (3.3).
#
# ci.yml owns the mandatory Gitleaks `secret-scan` job for every push and PR
# (3.5): redacted output, failing exit on findings, and it feeds the gate.

name: ci

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan (redacted)
        # v2.3.6 pinned: v3 requires a GITLEAKS_LICENSE secret unconditionally;
        # v2.3.6 only enforces it for Organization-owned repos (this repo is
        # user-owned, so the scan runs license-free). GITLEAKS_VERSION pins the
        # gitleaks binary; the action scans the event range with --redact and
        # fails the job (exit 1) when findings exist (3.5).
        uses: gitleaks/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: "8.24.3"

  workflow-lint:
    # actionlint static validation of every workflow in .github/workflows.
    # Version-pinned container image; the repo-tools structural tests
    # (tests/ci) are the local equivalent that runs without a container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (version-pinned container)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          # Structural workflow validation is strict; the only suppressions are
          # the two pre-existing shellcheck STYLE/INFO codes (bare codes — the
          # docker action would otherwise pass quoted patterns literally).
          args: -color -ignore SC2129 -ignore SC2012

  affected-area:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    outputs:
      services: ${{ steps.detect.outputs.services }}
      services_json: ${{ steps.detect.outputs.services_json }}
      platform: ${{ steps.detect.outputs.platform }}
      workbench: ${{ steps.detect.outputs.workbench }}
      infra: ${{ steps.detect.outputs.infra }}
      ci: ${{ steps.detect.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected areas
        id: detect
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base="origin/${{ github.base_ref }}"
            head="${{ github.event.pull_request.head.sha }}"
          fi
          out=$(python scripts/ci/detect_changes.py "$base" "$head" --json)
          services=$(jq -c '[.services[]]' <<<"$out")
          services_csv=$(jq -r '[.services[]] | join(",")' <<<"$out")
          platform=$(jq -c '[.areas[] | select(startswith("platform_"))]' <<<"$out")
          workbench=$(jq -c '[.areas[] | select(. == "workbench")]' <<<"$out")
          infra=$(jq -c '[.areas[] | select(. == "infra")]' <<<"$out")
          ci=$(jq -c '[.areas[] | select(. == "ci")]' <<<"$out")
          echo "services=$services_csv" >> "$GITHUB_OUTPUT"
          echo "services_json=$services" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "workbench=$workbench" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "ci=$ci" >> "$GITHUB_OUTPUT"

  mode:
    runs-on: ubuntu-latest
    needs: [affected-area]
    outputs:
      name: ${{ steps.mode.outputs.name }}
    steps:
      - id: mode
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          ref="${{ github.ref }}"
          base="${{ github.base_ref }}"
          if [[ "$event" == "pull_request" ]]; then
            if [[ "$base" == "develop" ]]; then
              echo "name=feature-pr" >> "$GITHUB_OUTPUT"
            else
              echo "name=release-pr" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "$ref" == "refs/heads/main" ]]; then
              echo "name=main-merge" >> "$GITHUB_OUTPUT"
            elif [[ "$ref" == "refs/heads/develop" ]]; then
              echo "name=develop-merge" >> "$GITHUB_OUTPUT"
            else
              echo "name=feature-push" >> "$GITHUB_OUTPUT"
            fi
          fi

  gate:
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - workflow-lint
      - affected-area
      - mode
      - service-ci
      - container-build
      - backend-container-smoke
      - workbench-check
      - platform-check
      - terraform-plan
      - repo-tools
    if: ${{ always() }}
    steps:
      - name: Aggregate required-check results
        env:
          SCAN: ${{ needs.secret-scan.result }}
          WL: ${{ needs.workflow-lint.result }}
          AREA: ${{ needs.affected-area.result }}
          MODE: ${{ needs.mode.result }}
          # GitHub reports a reusable's result as failure when its services
          # matrix is empty (ci-only changes) even if neutral-skip succeeds.
          # Normalize that to skipped so the gate only fails on real service
          # failures.
          SVC: ${{ needs.service-ci.result == 'failure' && needs.affected-area.outputs.services_json == '[]' && 'skipped' || needs.service-ci.result }}
          CTN: ${{ needs.container-build.result }}
          BCTN: ${{ needs.backend-container-smoke.result }}
          WB: ${{ needs.workbench-check.result }}
          PLT: ${{ needs.platform-check.result }}
          TF: ${{ needs.terraform-plan.result }}
          REPO: ${{ needs.repo-tools.result }}
        run: |
          set -euo pipefail
          # R8.5: the final gate aggregates EVERY governed job (including
          # repo-tools) via the shared, failure-injection-tested script so a
          # governed failure can never escape the aggregate.
          python scripts/ci/gate_aggregate.py \
            --result secret-scan="$SCAN" \
            --result workflow-lint="$WL" \
            --result affected-area="$AREA" \
            --result mode="$MODE" \
            --result service-ci="$SVC" \
            --result container-build="$CTN" \
            --result backend-container-smoke="$BCTN" \
            --result workbench-check="$WB" \
            --result platform-check="$PLT" \
            --result terraform-plan="$TF" \
            --result repo-tools="$REPO"

  service-ci:
    needs: [mode, affected-area]
    if: ${{ always() && needs.mode.result == 'success' }}
    uses: ./.github/workflows/_python-service-ci.yml
    with:
      services: ${{ needs.affected-area.outputs.services_json }}
      integration: ${{ needs.mode.outputs.name == 'feature-pr' || needs.mode.outputs.name == 'develop-merge' }}
      contract: ${{ needs.mode.outputs.name == 'feature-pr' || needs.mode.outputs.name == 'develop-merge' }}
      coverage: ${{ needs.mode.outputs.name == 'feature-pr' || needs.mode.outputs.name == 'develop-merge' }}

  container-build:
    needs: [mode, affected-area, service-ci]
    # P2-08: build ONLY the affected images. The static 4-row matrix is the
    # config lookup; each row passes `enabled` = (service in services_json) to
    # the reusable workflow, whose build job `if: inputs.enabled` skips
    # non-affected rows (inputs are allowed in reusable job if; matrix is not).
    if: ${{ always() && needs.mode.result == 'success' && needs.affected-area.outputs.services_json != '[]' && (needs.mode.outputs.name == 'feature-pr' || needs.mode.outputs.name == 'develop-merge' || needs.mode.outputs.name == 'release-pr' || needs.mode.outputs.name == 'main-merge') }}
    uses: ./.github/workflows/_container-build.yml
    with:
      image: ${{ matrix.image }}
      tag: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('ci-{0}', github.sha) }}
      scope: ${{ matrix.scope }}
      dockerfile: ${{ matrix.dockerfile }}
      platforms: ${{ matrix.platforms }}
      push: false
      export_cache: true
      enabled: ${{ contains(fromJson(needs.affected-area.outputs.services_json), matrix.service) }}
    strategy:
      fail-fast: false
      # Static config lookup: service (full area id), scope (short cache
      # name), dockerfile, image, platforms. Rows for non-affected services
      # are skipped inside the reusable workflow via `enabled`.
      matrix:
        include:
          - service: backend_service
            scope: backend
            dockerfile: services/product/backend_service/Dockerfile
            image: imjusthman/ai-live-backend
            platforms: linux/arm64
          - service: llm_service
            scope: llm
            dockerfile: services/product/llm_service/Dockerfile
            image: imjusthman/ai-live-llm
            platforms: linux/amd64
          - service: tts_service
            scope: tts
            dockerfile: services/product/tts_service/Dockerfile
            image: imjusthman/ai-live-tts
            platforms: linux/amd64
          - service: avatar_service
            scope: avatar
            dockerfile: services/product/avatar_service/Dockerfile
            image: imjusthman/ai-live-avatar
            platforms: linux/amd64

  # F.9: built-container smoke — build a production-shaped backend image and
  # prove packaged resources + readiness semantics from inside the container.
  # Cheaper than the release image (no push, no cache export); catches
  # packaging/entrypoint defects on ordinary runners without GPU/model/cloud.
  backend-container-smoke:
    runs-on: ubuntu-latest
    needs: [mode, affected-area]
    if: ${{ always() && needs.mode.result == 'success' && contains(fromJson(needs.affected-area.outputs.services_json), 'backend_service') && (needs.mode.outputs.name == 'feature-pr' || needs.mode.outputs.name == 'develop-merge' || needs.mode.outputs.name == 'release-pr' || needs.mode.outputs.name == 'main-merge') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build production-shaped backend image
        run: docker build -f services/product/backend_service/Dockerfile -t ai-live-backend:smoke .
      - name: Run built-container artifact/readiness smoke
        run: python services/product/backend_service/scripts/container_smoke.py --mode docker --image ai-live-backend:smoke

  workbench-check:
    runs-on: ubuntu-latest
    needs: [affected-area, mode]
    if: ${{ always() && needs.mode.result == 'success' && contains(fromJson(needs.affected-area.outputs.workbench), 'workbench') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: workbench
      - name: Workbench lint
        run: npm run lint
        working-directory: workbench
      - name: Workbench build
        run: npm run build
        working-directory: workbench

  platform-check:
    runs-on: ubuntu-latest
    needs: [affected-area, mode]
    if: ${{ always() && needs.mode.result == 'success' && fromJson(needs.affected-area.outputs.platform) != '[]' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform runtime configs (offline, no Docker)
        run: |
          set -euo pipefail
          python services/platform/livekit/validate_config.py
          bash -n services/platform/livekit/entrypoint.sh
          bash -n services/platform/lmcache/entrypoint.sh

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [affected-area, mode]
    if: ${{ always() && needs.mode.result == 'success' && contains(fromJson(needs.affected-area.outputs.infra), 'infra') }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
      - name: Terraform format check
        run: terraform fmt -check -recursive infra
      - name: Terraform validate (no backend)
        run: |
          for ws in global dev staging prod; do
            terraform -chdir=infra/environments/$ws init -backend=false
            terraform -chdir=infra/environments/$ws validate
          done

  repo-tools:
    runs-on: ubuntu-latest
    needs: [affected-area, mode]
    if: ${{ always() && needs.mode.result == 'success' && contains(fromJson(needs.affected-area.outputs.ci), 'ci') }}
    steps:
      # Full history: test_validate_workflow_inputs resolves non-HEAD SHAs
      # (e.g. ac0ff9c) against the repo; shallow checkout would fail them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check (root tools + CI scripts)
        run: uvx ruff check scripts/ci scripts/contracts benchmarks/infra_scripts 2>/dev/null || uvx ruff check scripts/ci scripts/contracts
      - name: Repo-tools + CI tests
        run: uv run python -m pytest tests/ci -q
