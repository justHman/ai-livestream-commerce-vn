name: ci

"on":
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    name: offline-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run offline core tests
        env:
          RENDER_BACKEND: mock
          LLM_ENGINE: none
          TTS_ENGINE: tone
          DIRECTOR_ENABLED: "0"
          APP_ENV: dev
        run: python -m pytest core/tests/ -q

  docker-build:
    name: docker-build-backend
    runs-on: ubuntu-latest
    # Smoke-build only when backend Dockerfile exists. No push, no AWS keys.
    # Native runner arch is enough for CI; production images target arm64 on Hub.
    if: ${{ hashFiles('services/backend/Dockerfile') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: false
          tags: justhman/ai-live-backend:ci
          load: true
