[project]
name = "ai-livestream-backend"
version = "0.1.0"
description = "VN AI livestream commerce backend (FastAPI core package)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "python-multipart",
  "python-dotenv",
  "redis",
  "PyJWT",
  # Runtime deps imported by core/ (mock render + TTS base use numpy/Pillow).
  "numpy",
  "Pillow",
  # providers/liveavatar_cloud SDK (cloud render backend).
  "requests",
  "websocket-client",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "async_timeout",
]
livekit = ["livekit"]
postgres = ["asyncpg"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "providers*"]
exclude = ["core.tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning:httpx.*",
  "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
