# Repository-root tool-only project. NOT built or installed as a package and
# NOT a runtime input to any product image (tool.uv.package = false). Holds
# only cross-service E2E, sandbox, contract-generation, and repository-tool
# dependencies; product services resolve from their own pyproject.toml +
# uv.lock (see services/product/*_service/).
[project]
name = "ai-livestream-repo-tools"
version = "0.0.0"
description = "Repository-root tool-only project (E2E, sandbox, contract, repo tools)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "pytest-timeout",
  "async_timeout",
  # Static GitHub Actions workflow validation parses YAML.
  "PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "tests/ci"]
pythonpath = [
  ".",
  "services/product/backend_service/src",
  "services/product/llm_service/src",
  "services/product/tts_service/src",
  "services/product/avatar_service/src",
]
filterwarnings = [
  "ignore::DeprecationWarning:httpx.*",
  "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.report]
branch = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
