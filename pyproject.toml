[project]
name = "ai-livestream-backend"
version = "0.1.0"
description = "VN AI livestream commerce repository tools and compatibility tests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "python-multipart",
  "python-dotenv",
  "redis",
  "PyJWT",
  # Compatibility-test dependencies for staged legacy imports.
  "numpy",
  "Pillow",
  "requests",
  "websocket-client",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "async_timeout",
]
livekit = ["livekit"]
postgres = ["asyncpg"]
director = ["sentence-transformers>=5,<6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests"]
pythonpath = [
  ".",
  "services/product/backend_service/src",
  "services/product/llm_service/src",
  "services/product/tts_service/src",
  "services/product/avatar_service/src",
]
filterwarnings = [
  "ignore::DeprecationWarning:httpx.*",
  "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
