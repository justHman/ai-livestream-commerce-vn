# Minimal LiveKit SFU config for AWS MVP.
# Keys/domain come from env / SSM at deploy time — do not commit secrets.

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

# Set LIVEKIT_KEYS via env (APIKey: APISecret pairs). See entrypoint.
keys: {}

logging:
  level: info
