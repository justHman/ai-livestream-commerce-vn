[project]
name = "ai-livestream-llm"
version = "0.1.0"
description = "Self-host LLM inference service package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi"]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python"]
sglang = ["sglang"]
transformers = ["torch", "transformers"]
vllm = ["vllm==0.22.1"]
test = ["pytest"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Integration/contract suites and live-stack behavior never run in ordinary CI;
# select them explicitly (see scripts/ci/test_matrix.json).
addopts = "--ignore=tests/integration --ignore=tests/contract"

[tool.coverage.run]
branch = true
source = ["llm"]

[tool.coverage.report]
fail_under = 80
