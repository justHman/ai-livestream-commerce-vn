[project]
name = "ai-livestream-llm"
version = "0.1.0"
description = "Self-host LLM inference service package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llamacpp = ["llama-cpp-python"]
sglang = ["sglang"]
transformers = ["torch", "transformers"]
vllm = ["vllm==0.22.1"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm*"]
