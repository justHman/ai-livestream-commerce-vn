[project]
name = "ai-livestream-tts"
version = "0.1.0"
description = "Self-host text-to-speech service package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi",
    "numba>=0.60",
]

[project.optional-dependencies]
cosyvoice = ["torch"]
transformers = ["torch", "transformers"]
vieneu = ["vieneu==3.2.4"]
test = ["pytest"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Integration/contract suites and live-stack behavior never run in ordinary CI;
# select them explicitly (see scripts/ci/test_matrix.json).
addopts = "--ignore=tests/integration --ignore=tests/contract"

[tool.coverage.run]
branch = true
source = ["tts"]

[tool.coverage.report]
fail_under = 80
