[project]
name = "ai-livestream-backend"
version = "0.1.0"
description = "VN AI livestream commerce control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "python-multipart",
  "python-dotenv",
  "redis",
  "PyJWT",
  "numpy",
  "Pillow",
  "requests",
  "websocket-client",
]

[project.optional-dependencies]
director = ["sentence-transformers>=5,<6"]
livekit = ["livekit"]
postgres = ["asyncpg"]
test = ["pytest", "pytest-asyncio", "pytest-timeout", "async_timeout"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]
