[project]
name = "liveavatar-demo"
version = "0.1.0"
description = "LiveAvatar mock demo — block-wise autoregressive streaming proof-of-concept with anti-drift"
requires-python = ">=3.10"

dependencies = [
    "gradio>=4.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.36",
    "edge-tts>=6.1",
    "aiortc>=1.9",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
