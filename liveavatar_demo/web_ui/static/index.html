<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveAvatar Demo — WebRTC Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #7c6ff0;
        }
        #video-container {
            position: relative;
            width: 720px;
            max-width: 100%;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(124, 111, 240, 0.2);
        }
        video {
            width: 100%;
            display: block;
            background: #000;
        }
        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        #status-bar {
            margin-top: 12px;
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }
        .status-item {
            background: #1a1a2e;
            padding: 6px 14px;
            border-radius: 4px;
        }
        .status-item .label { color: #888; }
        .status-item .value { color: #7c6ff0; font-weight: 600; }
        #error-msg {
            color: #ff4444;
            margin-top: 10px;
            display: none;
        }
        #controls {
            margin-top: 16px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #7c6ff0;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background: #6a5ce0; }
        button:disabled { background: #444; cursor: not-allowed; }
        #signaling-url {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>LiveAvatar Demo — WebRTC Viewer</h1>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay">
            <span id="overlay-text">Waiting for stream...</span>
        </div>
    </div>

    <div id="status-bar">
        <div class="status-item">
            <span class="label">State: </span>
            <span class="value" id="pc-state">new</span>
        </div>
        <div class="status-item">
            <span class="label">Blocks: </span>
            <span class="value" id="block-count">0</span>
        </div>
        <div class="status-item">
            <span class="label">FPS: </span>
            <span class="value" id="fps">0</span>
        </div>
    </div>

    <div id="controls">
        <button id="btn-start">Start Stream</button>
        <button id="btn-stop" disabled>Stop Stream</button>
    </div>

    <div id="error-msg"></div>
    <div id="signaling-url">Signaling: http://localhost:8000/offer</div>

    <script>
        const video = document.getElementById('video');
        const overlayText = document.getElementById('overlay-text');
        const pcState = document.getElementById('pc-state');
        const blockCount = document.getElementById('block-count');
        const fpsDisplay = document.getElementById('fps');
        const errorMsg = document.getElementById('error-msg');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');

        let pc = null;
        let signalingUrl = 'http://localhost:8000/offer';
        let frameCount = 0;
        let lastFrameTime = performance.now();

        // Detect signaling URL from current host
        const currentHost = window.location.hostname;
        if (currentHost && currentHost !== 'localhost' && currentHost !== '127.0.0.1') {
            signalingUrl = `http://${currentHost}:8000/offer`;
        }

        async function startStream() {
            try {
                errorMsg.style.display = 'none';
                overlayText.textContent = 'Connecting...';
                btnStart.disabled = true;

                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.onconnectionstatechange = () => {
                    pcState.textContent = pc.connectionState;
                    if (pc.connectionState === 'connected') {
                        overlayText.textContent = '';
                    } else if (pc.connectionState === 'failed') {
                        showError('Connection failed');
                        btnStart.disabled = false;
                    }
                };

                pc.ontrack = (event) => {
                    video.srcObject = event.streams[0];
                    overlayText.textContent = 'Stream active';
                    frameCount = 0;
                };

                // Add transceiver for receiving video
                pc.addTransceiver('video', { direction: 'recvonly' });

                // Create offer
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Send offer to signaling server
                const response = await fetch(signalingUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`Signaling failed: ${response.status}`);
                }

                const answer = await response.json();
                await pc.setRemoteDescription(
                    new RTCSessionDescription(answer)
                );

                btnStop.disabled = false;

                // Start FPS counter
                updateStats();

            } catch (err) {
                showError(err.message);
                btnStart.disabled = false;
            }
        }

        function stopStream() {
            if (pc) {
                pc.close();
                pc = null;
            }
            video.srcObject = null;
            pcState.textContent = 'closed';
            overlayText.textContent = 'Stream stopped';
            btnStart.disabled = false;
            btnStop.disabled = true;
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function updateStats() {
            // Estimate FPS from video requestAnimationFrame
            let lastTime = performance.now();
            let frames = 0;

            function countFrame() {
                frames++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    fpsDisplay.textContent = frames;
                    blockCount.textContent = Math.floor(frames / 3); // 3 frames/block
                    frames = 0;
                    lastTime = now;
                }
                requestAnimationFrame(countFrame);
            }

            // Only count when video is playing
            video.addEventListener('play', () => {
                requestAnimationFrame(countFrame);
            });
        }

        btnStart.addEventListener('click', startStream);
        btnStop.addEventListener('click', stopStream);
    </script>
</body>
</html>
